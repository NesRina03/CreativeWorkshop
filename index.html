<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<title>The Haunted House: The Five Convolutions</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="stage">
  <canvas id="view" width="320" height="200"></canvas>
  <div id="lensFx"></div>
  <div id="flashFx"></div>
  <div id="crosshair" class="dot"></div>

  <!-- ================= HUD ================= -->
  <div id="hud" class="hidden">
    <div id="gcounters"></div>
    <div id="timerBox"><div id="timer">00:00</div></div>
    <div id="rightHud">
      <div id="spellCount"><img id="spellCountImg" alt=""><span id="spellCountTxt">0/5</span></div>
      <div class="ibtns">
        <button class="ibtn off" id="btnLens" tabindex="-1"><img id="lensImg" alt=""><span class="k">L</span></button>
        <button class="ibtn" id="btnBook" tabindex="-1"><img id="bookImg" alt=""><span class="k">B</span></button>
        <button class="ibtn" id="btnHelp" tabindex="-1"><img id="helpImg" alt=""><span class="k">?</span></button>
        <button class="ibtn" id="btnPause" tabindex="-1"><img id="pauseImg" alt=""><span class="k">ESC</span></button>
      </div>
    </div>
    <div id="keyhint"></div>
    <div id="prompt"></div>
    <div id="toast"></div>
    <div id="clickHint"></div>
  </div>

  <!-- ================= MAIN MENU ================= -->
  <div id="menu" class="screen">
    <div class="title" data-i="title">THE HAUNTED HOUSE</div>
    <div class="subtitle" data-i="subtitle">The Five Convolutions</div>
    <div class="menuBtns">
      <button class="btn" id="mPlay" data-i="play">PLAY</button>
      <button class="btn" id="mOptions" data-i="options">OPTIONS</button>
      <button class="btn" id="mLanguage" data-i="language">LANGUAGE</button>
      <button class="btn" id="mExit" data-i="exit">EXIT</button>
    </div>
  </div>

  <!-- ================= OPTIONS ================= -->
  <div id="options" class="screen dim hidden">
    <div class="panel" style="width:560px">
      <div class="ptitle" data-i="options">OPTIONS</div>
      <div class="optRow"><span data-i="sound">SOUND</span><input type="range" id="volSfx" min="0" max="100" value="70"><b id="vSfxTxt">70</b></div>
      <div class="optRow"><span data-i="music">MUSIC</span><input type="range" id="volMus" min="0" max="100" value="50"><b id="vMusTxt">50</b></div>
      <div class="center"><button class="btn" id="optBack" data-i="back">BACK</button></div>
    </div>
  </div>

  <!-- ================= LANGUAGE ================= -->
  <div id="language" class="screen dim hidden">
    <div class="panel" style="width:560px">
      <div class="ptitle" data-i="language">LANGUAGE</div>
      <div class="center col">
        <button class="btn" id="langEn">ENGLISH (EN)</button>
        <button class="btn" id="langAr">العربية (AR)</button>
        <button class="btn" id="langBack" data-i="back">BACK</button>
      </div>
    </div>
  </div>

  <!-- ================= PAUSE ================= -->
  <div id="pause" class="screen dim hidden">
    <div class="panel" style="width:520px">
      <div class="ptitle" data-i="paused">PAUSED</div>
      <div class="center col">
        <button class="btn" id="pResume" data-i="resume">RESUME</button>
        <button class="btn" id="pRestart" data-i="restart">RESTART</button>
        <button class="btn" id="pOptions" data-i="options">OPTIONS</button>
        <button class="btn" id="pLanguage" data-i="language">LANGUAGE</button>
        <button class="btn" id="pExit" data-i="exit">EXIT</button>
      </div>
    </div>
  </div>

  <!-- ================= CUTSCENE ================= -->
  <div id="cutscene" class="screen hidden">
    <canvas id="csCanvas" width="320" height="200"></canvas>
    <div id="csBox"><div id="csText"></div><div id="csDots"></div></div>
    <div id="csSkip" data-i="skip">Press ENTER to skip</div>
    <div id="csNext" data-i="next">SPACE / CLICK: next</div>
  </div>

  <!-- ================= SPELL COLLECTED PANEL ================= -->
  <div id="spellPanel" class="screen dim hidden">
    <div class="panel" id="spBox" style="width:600px">
      <div class="spHead"><img id="spIcon" alt=""><div><div class="spTag" data-i="spellFound">SPELL DISCOVERED</div><div id="spTitle"></div></div></div>
      <div id="spOp"></div>
      <div id="spFn"></div>
      <div id="spMatrix"></div>
      <div id="spNorm"></div>
      <div class="center"><button class="btn" id="spCont" data-i="cont">CONTINUE</button></div>
    </div>
  </div>

  <!-- ================= SPELLBOOK ================= -->
  <div id="book" class="screen dim hidden">
    <div class="bookWrap">
      <button id="bkClose" class="xbtn">X</button>
      <div class="page left">
        <h3 data-i="bookTitle">SPELLBOOK</h3>
        <div id="bkList"></div>
        <div id="bkHint"></div>
      </div>
      <div class="spine"></div>
      <div class="page right">
        <div id="bkDetail"></div>
        <div id="bkFoot">
          <div id="bkAttempts"></div>
          <div id="bkMsg"></div>
          <button id="bkCast" class="btn small" data-i="cast">CAST ON GHOST</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= WIN ================= -->
  <div id="win" class="screen hidden">
    <div class="title win" data-i="winTitle">THE MANSION IS FREE!</div>
    <div class="msg" data-i="winMsg"></div>
    <div id="winStats" class="stats"></div>
    <div class="menuBtns row">
      <button class="btn" id="winAgain" data-i="playAgain">PLAY AGAIN</button>
      <button class="btn" id="winMenu" data-i="mainMenu">MAIN MENU</button>
    </div>
  </div>

  <!-- ================= LOSE ================= -->
  <div id="lose" class="screen hidden">
    <div class="title lose" data-i="loseTitle">THE SPIRITS HAVE WON...</div>
    <div class="msg" data-i="loseMsg"></div>
    <div id="loseReason" class="reason"></div>
    <div class="menuBtns row">
      <button class="btn" id="loseAgain" data-i="restart">RESTART</button>
      <button class="btn" id="loseMenu" data-i="mainMenu">MAIN MENU</button>
    </div>
  </div>

  <!-- ================= BYE ================= -->
  <div id="bye" class="screen hidden">
    <div class="title" data-i="thanks">THANKS FOR PLAYING!</div>
    <div class="msg" data-i="byeMsg"></div>
    <div class="menuBtns"><button class="btn" id="byeBack" data-i="mainMenu">MAIN MENU</button></div>
  </div>
</div>
<script src="js/main.js"></script>
</body>
</html>
